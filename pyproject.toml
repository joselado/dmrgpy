# setuptools>=77 (not 61) is required because the [project] table below uses
# PEP 639 licensing: `license` as a bare SPDX expression plus `license-files`.
# setuptools only learned both in 77.0 -- with anything older, `license` is
# parsed as the legacy free-text/table form and `license-files` is rejected
# outright, so the build fails rather than silently mislabelling the license.
[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dmrgpy"
version = "0.1.0"
description = "Quasi-one-dimensional spin, fermionic, parafermion and bosonic systems with matrix product states (DMRG/ED)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [{name = "Jose Lado", email = "jose.lado@aalto.fi"}]
# 3.10, not 3.9: numba is a hard runtime dependency (see the comment above
# [project.optional-dependencies]) and current numba declares Requires-Python
# >=3.10. Claiming >=3.9 doesn't make dmrgpy work on 3.9 -- it just makes pip
# backtrack to whatever ancient numba/numpy pair still supports it, which is
# an untested combination. Fail the resolution honestly instead.
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "sympy",
    "numba",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/joselado/dmrgpy"
Repository = "https://github.com/joselado/dmrgpy"
Issues = "https://github.com/joselado/dmrgpy/issues"

# Extras for optional, non-default backends/tools that are only imported
# lazily by specific submodules -- never required just to `import dmrgpy`.
# (numba is NOT here: algebra/kpmextrapolate.py imports it at module level,
# and that module is reached unconditionally via manybodychain -> dynamics
# -> kpmdmrg -> algebra.kpm -> algebra.kpmextrapolate, so it's a core
# dependency in practice, not an optional one.)
[project.optional-dependencies]
# juliacall, not the "julia" (PyJulia) distribution: the live Julia backend
# was migrated from PyJulia to juliacall/PythonCall.jl (mpsjulialive/
# juliasession.py imports juliacall at module level). The only remaining
# `import julia` is juliarun.py, which belongs to the legacy subprocess
# path that isn't reachable through the public API (see CLAUDE.md), so
# PyJulia is deliberately not pulled in.
julia = ["juliacall"]       # mpsjulialive/juliasession.py (itensor_version="julia_live")
jax = ["jax"]               # pyitensor/kernels.py
stats = ["statsmodels"]     # algebra/kpmextrapolate.py (function-local import)
parallel = ["multiprocess", "dill"]  # parallel.py, algebra/parallel.py, parallelslurm.py
full = ["dmrgpy[julia,jax,stats,parallel]"]

# NOTE: this PyPI package ships the pure-Python part of dmrgpy only (the ED
# backend and the pure-Python "pyitensor" DMRG/TDVP backend both work
# out of the box). The compiled C++ DMRG backends (itensor_version=2/3,
# built against a ~400MB vendored ITensor copy) are not distributed on
# PyPI -- they are compiled in place from a git checkout via
# `python install.py`, which is a repo-level build step, not a pip
# extension build (see CLAUDE.md / install.py). Without them compiled,
# dmrgpy transparently falls back to ED (see mode.py), so the package is
# fully usable as installed; run install.py from a clone of the repo for
# the faster compiled backends.
[tool.setuptools.packages.find]
where = ["src"]
include = ["dmrgpy*"]
exclude = ["dmrgpy.mpscpp2", "dmrgpy.mpscpp2.*", "dmrgpy.mpscpp3", "dmrgpy.mpscpp3.*"]

[tool.setuptools.package-data]
# juliapkg.json is not documentation -- juliacall/juliapkg reads it at
# import time to resolve and precompile the Julia side (ITensors,
# ITensorMPS, ITensorNHDMRG) into its managed project. Without it in the
# wheel, `pip install dmrgpy[julia]` installs a julia_live backend that
# finds no ITensors.jl at all.
dmrgpy = ["juliapkg.json", "mpsjulia/*.jl", "mpsjulia/compiler/*.jl"]
"dmrgpy.mpsjulialive" = ["*.jl"]
"dmrgpy.algebra" = ["fortran/algebra/*.f90"]
